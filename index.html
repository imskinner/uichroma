<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Paleta de cores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <section class="leftCol">
            <section class="logo"><img src="img/logo-palettai.png" alt="Pallet.ai" height="40"></section>
            <section class="content">
              <header>
                <h1>Discover Inspiring Colors for Your Next Design</h1>
                <p>Instantly create beautiful UI color schemes with this AI-powered palette generator. Input keywords and traits, and generates endless variations to inspire your next project.</p>
              </header>
              <section>
                <div class="inputText">
                  <label for="feelings">Enter keywords for your project:</label>
                  <input type="text" id="feelings" placeholder="e.g. dating app, car wash, romance, pet, health">
                  
                </div>
                <div class="checkboxCombo">
                  <label for="feelingsCheckboxes">Select traits if you want to enhance your query:</label>
                  <div id="feelingsCheckboxes"></div>
                </div>
                <button id="generate">Generate colors</button>
              </section>
            </section>
        </section>
        <section class="rightCol">
            <div id="loader" class="loader" style="display: none;"></div>
            <div id="palette"></div>
            <div id="response-container"></div>
        </section>
    </div>
  <script src="script.js"></script>
</body>
</html>
