<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Paleta de cores</title>
</head>
<body>
    <div class="wrapper">
        <div class="leftCol">
            <div><img src="/img/logo.png" alt="Pallet.ai" height="40"></div>
            <h1>Get color ideas for your next project</h1>
            <p>Generate colors based on keywords, traits and emotions and let the AI do the trick.</p>
            <label for="feelings">Enter keywords for your project:</label>
            <input type="text" id="feelings" placeholder="e.g. happy, tech, romance">
            <div id="feelingsCheckboxes"></div>
            <button id="generate">Generate colors</button>
        </div>
        <div class="rightCol">
            <div id="loader" class="loader" style="display: none;"></div>
            <div id="palette"></div>
        </div>
    </div>
  <script src="script.js"></script>
</body>
</html>
