<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/classic.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js" defer></script>
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon.png">
  <title>UI Chroma - AI-Powered Color Palette Generator for Designers and Developers</title>
  <link rel="canonical" href="https://www.uichroma.com/" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <section class="leftCol">
            <section class="logo"><img src="img/logo.svg" alt="UI Chroma" height="28"></section>
            <section class="content">
              <header>
                <h1>AI-Powered Color Palette Generator</h1>
                <p>Describe your project, brand, or mood — our AI will craft a complete color system tailored to your vision.</p>
              </header>
              <section>
                <div class="inputText">
                  <label for="prompt">Describe your project or the vibe you're going for:</label>
                  <textarea id="prompt" rows="3" placeholder="e.g. A fintech app that feels trustworthy and modern, with a bold accent for CTAs..."></textarea>
                </div>
                <button id="generate">Generate Palette</button>
              </section>
            </section>
        </section>
        <section class="rightCol">
            <div id="loader" class="loader" style="display: none;"></div>
            <div id="placeholder-template">
              <div class="color-box"></div>
              <div class="color-box"></div>
              <div class="color-box"></div>
              <div class="color-box"></div>
              <div class="color-box"></div>
              <div class="color-box"></div>
              <div class="color-box"></div>
              <div class="color-box"></div>
            </div>
            <div id="palette"></div>
            <div id="response-container">
              <h3>Describe your vision to generate a color palette</h3>
            </div>
            
            <div id="permalink-container"></div>
        </section>
    </div>
  <script src="client.js"></script>
</body>
</html>
