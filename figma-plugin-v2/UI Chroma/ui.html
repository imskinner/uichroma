<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>UI Chroma</title>
    <style>
      body { font-family: sans-serif; padding: 16px; font-size: 13px; }
      label { display: block; margin-top: 12px; font-weight: 600; }
      input, textarea, select { width: 100%; margin-top: 4px; padding: 7px 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
      button { margin-top: 16px; width: 100%; padding: 10px; cursor: pointer; background: #18a0fb; color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; }
      button:disabled { background: #aaa; cursor: not-allowed; }
      #status { margin-top: 12px; font-size: 12px; min-height: 18px; }
      #status.error { color: #e53e3e; }
      #status.success { color: #38a169; }
      hr { border: none; border-top: 1px solid #eee; margin: 16px 0; }
    </style>
  </head>
  <body>
    <h3 style="margin:0 0 4px">UI Chroma</h3>
    <p style="margin:0 0 12px;color:#666">Import a palette and create Figma styles</p>

    <label for="permalink">Palette URL or ID *</label>
    <input id="permalink" type="text" placeholder="https://uichroma.com/palette/… or bare ID" />

    <hr />

    <label for="projectName">Page Name</label>
    <input id="projectName" type="text" placeholder="My UI Project" />

    <label for="titleFont">Title Font</label>
    <select id="titleFont">
      <option value="Inter-Bold">Inter, Bold</option>
      <option value="Roboto-Bold">Roboto, Bold</option>
    </select>

    <label for="bodyFont">Body Font</label>
    <select id="bodyFont">
      <option value="Inter-Regular">Inter, Regular</option>
      <option value="Roboto-Regular">Roboto, Regular</option>
    </select>

    <button id="submit">Create Styles &amp; Components</button>
    <div id="status"></div>

    <script>
      const statusEl = document.getElementById('status');
      const submitBtn = document.getElementById('submit');

      function setStatus(msg, type) {
        statusEl.textContent = msg;
        statusEl.className = type || '';
      }

      // Request available fonts from plugin on load
      parent.postMessage({ pluginMessage: { type: 'get-fonts' } }, '*');

      window.onmessage = (event) => {
        const msg = event.data.pluginMessage;
        if (!msg) return;

        if (msg.type === 'fonts') {
          const fonts = msg.fonts;
          const titleSelect = document.getElementById('titleFont');
          const bodySelect = document.getElementById('bodyFont');
          titleSelect.innerHTML = '';
          bodySelect.innerHTML = '';
          fonts.forEach(font => {
            if (font.fontName && font.fontName.family && font.fontName.style) {
              const opt = document.createElement('option');
              opt.value = `${font.fontName.family}-${font.fontName.style}`;
              opt.textContent = `${font.fontName.family}, ${font.fontName.style}`;
              titleSelect.appendChild(opt.cloneNode(true));
              bodySelect.appendChild(opt);
            }
          });
        }

        if (msg.type === 'done') {
          setStatus('Styles and components created successfully!', 'success');
          submitBtn.disabled = false;
        }

        if (msg.type === 'error') {
          setStatus(msg.message || 'An error occurred.', 'error');
          submitBtn.disabled = false;
        }
      };

      submitBtn.onclick = () => {
        const permalink = document.getElementById('permalink').value.trim();
        if (!permalink) {
          setStatus('Please enter a palette permalink.', 'error');
          return;
        }
        setStatus('Fetching palette and creating styles…');
        submitBtn.disabled = true;
        parent.postMessage({
          pluginMessage: {
            type: 'create-styles-components',
            permalink,
            projectName: document.getElementById('projectName').value.trim(),
            titleFont: document.getElementById('titleFont').value,
            bodyFont: document.getElementById('bodyFont').value,
          }
        }, '*');
      };
    </script>
  </body>
</html>
